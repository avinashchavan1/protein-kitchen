server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: protein-kitchen
  datasource:
    # Supabase pooler (IPv4) — e.g. postgresql://...pooler.supabase.com:6543/postgres
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/protein_kitchen}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true

app:
  cors:
    # comma-separated allowed origins (Netlify URL + localhost dev)
    origins: ${FRONTEND_ORIGIN:http://localhost:5173,http://localhost:4173}
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-in-prod-min-32-bytes}
    ttl-seconds: ${JWT_TTL_SECONDS:2592000} # 30 days
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@proteinkitchen.app}

logging:
  level:
    org.springframework.security: WARN
